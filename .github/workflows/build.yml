name: Build Haatix Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download MediaPipe Hand Landmarker Model (only if missing)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -s app/src/main/assets/hand_landmarker.task ]; then
            curl -L -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          fi
          ls -lh app/src/main/assets/hand_landmarker.task

      - name: Generate debug keystore
        run: |
          # build.gradle.kts expects ${rootDir}/debug.keystore (it is gitignored, so it must be created in CI)
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l debug.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haatix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
